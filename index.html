<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: aquamarine;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        main {
            background-color: #FFFFFF;
            color: aquamarine;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        img {
            width: 80px;
            height: 80px;
        }
        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>MariMake</h1>
        <p>Vou compartilhar conhecimento sobre a arte e técnica da maquiagem</p>
    </header>

    <main>
        <img src="Imagem para blog de maquiagem e técnica, profissional e atraente, com elementos de cosméticos, pincéis de maquiagem, paletas de cores.jpg" alt="Coleção de produtos de maquiagem profissional incluindo paletas de sombras, blushes, batons, esmalte e pincéis de maquiagem dispostos sobre superfície de mármore branco com rosa decorativa">
        
        <button> ❤️<span>0</span></button>
        <button> 👍🏼<span>0</span></button>
        
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Mariana dos Santos</p>
            <p>Seja bem-vindo(a) ao meu projeto! Aqui vou compartilhar dicas sobre a arte e técnica da área de maquiagem.</p>
        </div>
    </main> 

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function(botao) {
            let curtiu = false;

            botao.addEventListener("click", function() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");

                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            });
        });  
    </script>
</body>
